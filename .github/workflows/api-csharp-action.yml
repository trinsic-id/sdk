name: Build API CSharp SDK

on:
  workflow_call:
    inputs:
      upload-artifact:
        type: boolean
        required: false
        default: false
        description: "Upload NuGet packages for the release job, default is false"

permissions:
  contents: read

jobs:
  build:
    # Keep this name: the main ruleset requires this PR check.
    name: Build and Publish
    # Only trusted release runs may produce artifacts for publishing.
    if: ${{ !inputs.upload-artifact || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'trinsic-id/sdk') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install NPM dependencies
        run: npm ci
      - name: Generate SDK
        run: ./api-csharp/build-sdk.sh
        shell: bash
      - name: Build sample
        run: ./api-csharp/build-samples.sh
        shell: bash
      - name: Test SDK request headers
        run: npm run test:sdk-headers
        env:
          SDK_LANGUAGE: csharp
      - name: Test named model construction
        run: npm run test:sdk-construction
        env:
          SDK_LANGUAGE: csharp
      - name: Test unknown enum values
        run: npm run test:sdk-unknown-enums
        env:
          SDK_LANGUAGE: csharp
      - name: Upload NuGet packages
        if: inputs.upload-artifact == true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-csharp-nuget
          path: |
            api-csharp/sdk/publish/*.nupkg
            api-csharp/sdk/publish/*.snupkg
          if-no-files-found: error
          overwrite: true

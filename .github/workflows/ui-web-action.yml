name: Build and Publish Web UI SDK

on:
  workflow_call:
    inputs:
      publish:
        type: boolean
        required: false
        default: false
        description: "Publish the package, default is false"

    secrets:
      NPM_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  build_and_publish:
    name: Build and Publish
    # Reusable workflows must also reject publish requests from PRs and other refs.
    if: ${{ !inputs.publish || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'trinsic-id/sdk') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install NPM dependencies
        run: npm ci
      - name: Generate api typescript SDK
        run: ./api-typescript/build-sdk.sh
        shell: bash
      - name: Generate ui web SDK
        run: ./ui-web/build-sdk.sh
        shell: bash
      - name: Build sample
        run: ./ui-web/build-samples.sh
        shell: bash
      - name: Publish ui web SDK
        if: inputs.publish == true
        run: ./ui-web/publish-sdk.sh
        shell: bash
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

name: Build Web UI SDK

on:
  workflow_call:
    inputs:
      upload-artifact:
        type: boolean
        required: false
        default: false
        description: "Upload packages for the release job, default is false"

permissions:
  contents: read

jobs:
  build_and_publish:
    # Keep this name: repository rulesets require the existing PR check.
    name: Build and Publish
    # Only trusted release runs may produce artifacts for publishing.
    if: ${{ !inputs.upload-artifact || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'trinsic-id/sdk') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install NPM dependencies
        run: npm ci
      - name: Generate api typescript SDK
        run: ./api-typescript/build-sdk.sh
        shell: bash
      - name: Generate ui web SDK
        run: ./ui-web/build-sdk.sh
        shell: bash
      - name: Build sample
        run: ./ui-web/build-samples.sh
        shell: bash
      - name: Upload release packages
        if: inputs.upload-artifact == true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-web-npm
          path: |
            ui-web/sdk/publish/trinsic-web-ui-*.tgz
          if-no-files-found: error
          overwrite: true

name: Build API Ruby SDK

on:
  workflow_call:
    inputs:
      upload-artifact:
        type: boolean
        required: false
        default: false
        description: "Upload packages for the release job, default is false"

permissions:
  contents: read

jobs:
  build_and_publish:
    # Keep this name: repository rulesets require the existing PR check.
    name: Build and Publish
    # Only trusted release runs may produce artifacts for publishing.
    if: ${{ !inputs.upload-artifact || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'trinsic-id/sdk') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install NPM dependencies
        run: npm ci
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1
        with:
          ruby-version: "3.3"
          bundler-cache: ${{ !inputs.upload-artifact }}
      - name: Generate SDK
        run: ./api-ruby/build-sdk.sh
        shell: bash
      - name: Build sample
        run: ./api-ruby/build-samples.sh
        shell: bash
      - name: Test SDK request headers
        run: npm run test:sdk-headers
        env:
          SDK_LANGUAGE: ruby
      - name: Test named model construction
        run: npm run test:sdk-construction
        env:
          SDK_LANGUAGE: ruby
      - name: Test SDK wire behavior
        run: npm run test:sdk-wire
        env:
          SDK_LANGUAGE: ruby
      - name: Test unknown enum values
        run: npm run test:sdk-unknown-enums
        env:
          SDK_LANGUAGE: ruby
      - name: Upload release packages
        if: inputs.upload-artifact == true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-ruby-rubygems
          path: |
            api-ruby/sdk/publish/trinsic_api-*.gem
          if-no-files-found: error
          overwrite: true

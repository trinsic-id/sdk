name: Build and Publish API Python SDK

on:
  workflow_call:
    inputs:
      publish:
        type: boolean
        required: false
        default: false
        description: "Publish the package, default is false"

    secrets:
      PYPI_API_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  build_and_publish:
    name: Build and Publish
    # Reusable workflows must also reject publish requests from PRs and other refs.
    if: ${{ !inputs.publish || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'trinsic-id/sdk') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install NPM dependencies
        run: npm ci
      - name: Generate SDK
        run: ./api-python/build-sdk.sh
        shell: bash
      - name: Build sample
        run: ./api-python/build-samples.sh
        shell: bash
      - name: Test SDK request headers
        run: npm run test:sdk-headers
        env:
          SDK_LANGUAGE: python
      - name: Publish SDK
        if: inputs.publish == true
        run: ./api-python/publish-sdk.sh
        shell: bash
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}

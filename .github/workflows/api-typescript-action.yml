name: Build API Typescript SDK

on:
  workflow_call:
    inputs:
      upload-artifact:
        type: boolean
        required: false
        default: false
        description: "Upload packages for the release job, default is false"

permissions:
  contents: read

jobs:
  build_and_publish:
    # Keep this name: repository rulesets require the existing PR check.
    name: Build and Publish
    # Only trusted release runs may produce artifacts for publishing.
    if: ${{ !inputs.upload-artifact || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'trinsic-id/sdk') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install NPM dependencies
        run: npm ci
      - name: Generate backend SDK
        run: ./api-typescript/build-sdk.sh
        shell: bash
      - name: Build sample
        run: ./api-typescript/build-samples.sh
        shell: bash
      - name: Test SDK request headers
        run: npm run test:sdk-headers
        env:
          SDK_LANGUAGE: typescript
      - name: Test named request arguments
        run: npm run test:sdk-construction
        env:
          SDK_LANGUAGE: typescript
      - name: Test unknown enum values
        run: npm run test:sdk-unknown-enums
        env:
          SDK_LANGUAGE: typescript
      - name: Upload release packages
        if: inputs.upload-artifact == true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: api-typescript-npm
          path: |
            api-typescript/sdk/publish/trinsic-api-*.tgz
          if-no-files-found: error
          overwrite: true

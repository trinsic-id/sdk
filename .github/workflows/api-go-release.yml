name: Release API Go SDK (GIT)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'trinsic-id/sdk'
    name: Publish Go Package
    uses: ./.github/workflows/api-go-action.yml
    concurrency:
      group: git-release
    with:
      publish: true
    secrets:
      MEWMBA_GIT_PUBLISH_TOKEN: ${{ secrets.MEWMBA_GIT_PUBLISH_TOKEN }}

name: Build and Publish Expo UI SDK

on:
  workflow_call:
    inputs:
      publish:
        type: boolean
        required: false
        default: false
        description: "Publish the package, default is false"

    secrets:
      NPM_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  build_and_publish:
    name: Build and Publish
    # Reusable workflows must also reject publish requests from PRs and other refs.
    if: ${{ !inputs.publish || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'trinsic-id/sdk') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install NPM dependencies
        run: npm ci
      - name: Build UI Expo SDK
        run: ./ui-expo/build-sdk.sh
        shell: bash
      - name: Build UI Expo Sample
        run: ./ui-expo/build-samples.sh
        shell: bash
      - name: Publish ui Expo SDK
        if: inputs.publish == true
        run: ./ui-expo/publish-sdk.sh
        shell: bash
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

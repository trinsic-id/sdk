name: Build Expo UI SDK

on:
  workflow_call:
    inputs:
      upload-artifact:
        type: boolean
        required: false
        default: false
        description: "Upload packages for the release job, default is false"

permissions:
  contents: read

jobs:
  build_and_publish:
    # Keep this name: repository rulesets require the existing PR check.
    name: Build and Publish
    # Only trusted release runs may produce artifacts for publishing.
    if: ${{ !inputs.upload-artifact || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'trinsic-id/sdk') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install NPM dependencies
        run: npm ci
      - name: Build UI Expo SDK
        run: ./ui-expo/build-sdk.sh
        shell: bash
      - name: Build UI Expo Sample
        run: ./ui-expo/build-samples.sh
        shell: bash
      - name: Upload release packages
        if: inputs.upload-artifact == true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ui-expo-npm
          path: |
            ui-expo/sdk/publish/trinsic-expo-ui-*.tgz
          if-no-files-found: error
          overwrite: true

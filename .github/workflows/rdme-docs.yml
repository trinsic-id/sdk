name: Sync ReadMe docs with SDKs README.md files

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "api-csharp/README.md"
      - "api-go/README.md"
      - "api-java/README.md"
      - "api-python/README.md"
      - "api-ruby/README.md"
      - "api-typescript/README.md"
      - "ui-android/README.md"
      - "ui-expo/README.md"
      - "ui-flutter/README.md"
      - "ui-swift/README.md"
      - "ui-web/README.md"
      - ".readme/**"

permissions:
  contents: read

jobs:
  api-csharp:
    name: Sync C# SDK Readme
    if: github.ref == 'refs/heads/main' && github.repository == 'trinsic-id/sdk' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
        with:
          persist-credentials: false
      - name: Prepare readme file
        run: cat api-csharp/README.md >> .readme/api-csharp.md
      - name: Run `docs` command
        uses: readmeio/rdme@9bcf3796d4d9d25c7b216b7db309707b2936737d # v10
        with:
          rdme: reference upload .readme/api-csharp.md --key=${{ secrets.README_API_KEY }} --branch=1.0
  api-go:

name: Build and Publish UI Android SDK

on:
  workflow_call:
    inputs:
      publish:
        type: boolean
        required: false
        default: false
        description: "Publish the package, default is false"

    secrets:
      MAVEN_CENTRAL_PUBLISHING_PASSWORD:
        required: false
      MAVEN_CENTRAL_PUBLISHING_USERNAME:
        required: false
      MAVEN_CENTRAL_SIGNING_KEY:
        required: false
      MAVEN_CENTRAL_SIGNING_KEY_PASSWORD:
        required: false
      MEWMBA_GIT_PUBLISH_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  build_and_publish:
    name: Build and Publish
    # Reusable workflows must also reject publish requests from PRs and other refs.
    if: ${{ !inputs.publish || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'trinsic-id/sdk') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: "temurin"
          java-version: "21"
      - name: Build SDK
        run: ./ui-android/build-sdk.sh
        shell: bash
      - name: Build sample
        run: ./ui-android/build-samples.sh
        shell: bash
      - name: Publish SDK
        if: inputs.publish == true
        run: ./ui-android/publish-sdk.sh
        shell: bash
        env:
          MEWMBA_GIT_PUBLISH_TOKEN: ${{ secrets.MEWMBA_GIT_PUBLISH_TOKEN }}
          SDK_REPOSITORY_PATH: ${{ github.repository }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_PUBLISHING_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PUBLISHING_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_CENTRAL_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_CENTRAL_SIGNING_KEY_PASSWORD }}

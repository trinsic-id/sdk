name: Build and Publish UI Flutter SDK

on:
  workflow_call:
    inputs:
      publish:
        type: boolean
        required: false
        default: false
        description: "Publish the package, default is false"

    secrets:
      DART_PUB_OAUTH_ACCESS_TOKEN:
        required: false
      DART_PUB_OAUTH_REFRESH_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  build_and_publish:
    name: Build and Publish
    # Reusable workflows must also reject publish requests from PRs and other refs.
    if: ${{ !inputs.publish || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'trinsic-id/sdk') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.24.0
          # Keep both cache actions inside flutter-action disabled.
          cache: false
          pub-cache: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: "temurin"
          java-version: "21"
      - name: Build SDK
        run: ./ui-flutter/build-sdk.sh
        shell: bash
      - name: Build Samples
        run: ./ui-flutter/build-samples.sh
        shell: bash
      - name: Publish SDK
        working-directory: ./
        if: inputs.publish == true
        env:
          DART_PUB_OAUTH_ACCESS_TOKEN: ${{ secrets.DART_PUB_OAUTH_ACCESS_TOKEN }}
          DART_PUB_OAUTH_REFRESH_TOKEN: ${{ secrets.DART_PUB_OAUTH_REFRESH_TOKEN }}
        run: |
          umask 077
          export XDG_CONFIG_HOME="$RUNNER_TEMP/dart-publish"
          mkdir -p "$XDG_CONFIG_HOME/dart"
          trap 'rm -f "$XDG_CONFIG_HOME/dart/pub-credentials.json"' EXIT
          jq -n '{
            accessToken: env.DART_PUB_OAUTH_ACCESS_TOKEN,
            refreshToken: env.DART_PUB_OAUTH_REFRESH_TOKEN,
            tokenEndpoint: "https://accounts.google.com/o/oauth2/token",
            scopes: ["openid", "https://www.googleapis.com/auth/userinfo.email"],
            expiration: 1570721159348
          }' > "$XDG_CONFIG_HOME/dart/pub-credentials.json"
          ./ui-flutter/publish-sdk.sh
        shell: bash

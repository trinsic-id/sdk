<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./style.css" />
  <link rel="icon" href="https://content.trinsic.id/assets/logo/favicon.ico" />
  <script type="module" src="./direct-session.js"></script>
  <title>Trinsic Direct Provider Session</title>
</head>
<body class="friendly-text">
  <main style="border: 1px solid black;padding: 20px; margin: 20px auto; max-width: 600px;">
    <h1>Direct Provider Session</h1>
    <p>
      <b>Session ID:</b> <code id="session-id"></code><br/>
      <b>Content should be refreshed:</b> <code id="content-refresh"></code><br/>
      <b>Next step:</b> <code id="next-step"></code><br/>
      <b>Polling for result:</b> <code id="polling"></code><br/>
      <b>Success:</b> <code id="success"></code><br/>
      <b>Done:</b> <code id="done"></code><br/>
      <b>Error code:</b> <code id="error-code"></code>
    </p>
    <canvas id="qrcode-canvas" style="max-width: 400px;max-height:400px;display:none;"></canvas>
    <div id="show-content" style="font-size: 4em; font-weight: bold; width: 100%; height: auto; text-align: center;display:none;"></div>
  </main>
</body>
</html>

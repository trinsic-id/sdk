<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./style.css" />
  <link rel="icon" href="https://content.trinsic.id/assets/logo/favicon.ico" />
  <script type="module" src="./shared.js"></script>
  <script type="module" src="./direct-poll-after-redirect.js"></script>
  <title>Trinsic UI sample</title>
</head>

<body class="friendly-text result-page">
  <main class="result-layout">
    <section class="result-card" aria-labelledby="poll-title">
      <p class="eyebrow">Verification in progress</p>
      <h1 id="poll-title">Polling for results</h1>
      <p>The results of the verification aren't yet available. This is related to the <code>PollAfterRedirect</code> capability.</p>
      <dl class="session-details">
        <div><dt>Session ID</dt><dd><code id="session-id"></code></dd></div>
        <div><dt>Success</dt><dd><code id="success"></code></dd></div>
        <div><dt>Done</dt><dd><code id="done"></code></dd></div>
        <div><dt>Last polled</dt><dd><code id="last-polled"></code></dd></div>
        <div><dt>Error code</dt><dd><code id="error-code"></code></dd></div>
      </dl>
    </section>
  </main>
</body>

</html>
